name: Appli Android (Play Store)
# Fabrique l'appli Android de MenuiPro (TWA : l'appli web dans une coque Android, sans barre d'adresse).
# Résultat (onglet Actions → ce flux → Artifacts) :
#   menuipro-android : app-release-bundle.aab (à envoyer au Play Store) + app-release-signed.apk (à installer directement)
#   cle-android-A-GARDER (seulement au premier passage) : la clé de signature + son mot de passe.
#     → La garder précieusement, et la mettre dans les secrets du dépôt (voir outils/android/LISEZMOI.md),
#       sinon chaque passage fabriquera une nouvelle clé et le Play Store refusera les mises à jour.
on:
  workflow_dispatch: {}
  push:
    branches: [play-store]
    paths: [outils/android/**, .github/workflows/android.yml]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Outils
        run: |
          npm i -g @bubblewrap/cli@1 --no-audit --no-fund
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_SDK_ROOT\"}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Clé de signature
        working-directory: outils/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > android.keystore
            echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "Clé reprise des secrets du dépôt."
          else
            P=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
            keytool -genkeypair -v -keystore android.keystore -alias menuipro -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$P" -keypass "$P" -dname "CN=MenuiPro, O=Xelkoom Valley, L=Dakar, C=SN"
            mkdir -p ../../cle-a-garder
            cp android.keystore ../../cle-a-garder/
            base64 -w0 android.keystore > ../../cle-a-garder/ANDROID_KEYSTORE_B64.txt
            echo "$P" > ../../cle-a-garder/ANDROID_KEYSTORE_PASSWORD.txt
            echo "::add-mask::$P"
            echo "KS_PASS=$P" >> "$GITHUB_ENV"
            echo "::warning::Nouvelle clé créée : télécharger l'artifact cle-android-A-GARDER et la mettre dans les secrets."
          fi
          echo "Empreinte SHA-256 (pour assetlinks.json) :"
          keytool -list -v -keystore android.keystore -alias menuipro -storepass "$KS_PASS" | grep "SHA256:" | tee empreinte.txt
      - name: Fabriquer le projet et l'appli
        working-directory: outils/android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KS_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KS_PASS }}
        run: |
          yes "" | bubblewrap update --skipVersionUpgrade
          yes "" | bubblewrap build --skipPwaValidation
          ls -la *.aab *.apk
      - uses: actions/upload-artifact@v4
        with:
          name: menuipro-android
          path: |
            outils/android/app-release-bundle.aab
            outils/android/app-release-signed.apk
            outils/android/empreinte.txt
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: cle-android-A-GARDER
          path: cle-a-garder/
          retention-days: 90
          if-no-files-found: ignore
